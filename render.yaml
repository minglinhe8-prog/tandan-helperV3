services:
  - type: web
    name: tandan-helper
    runtime: python
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      cd frontend && npm install --no-audit --no-fund && npm run build && mkdir -p ../static && cp -r dist/* ../static/ && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
    plan: free